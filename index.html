<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web3 Interactive Atlas — 深度内容 + 交互沙盒</title>
  <meta name="description" content="从 1 颗核心种子出发，通过张力驱动逐阶生长：22 大模块、44 个交互实验页与 V1–V5 综合排雷测验。" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Web3 Interactive Atlas — 22 模块 · 44 个链上交互沙盒" />
  <meta property="og:description" content="不谈暴富神话，只拆真实规则。涵盖钱包安全、多签托管、AMM/v3、循环贷清算、MEV、代币经济学、ZK 隐私、RWA 与 AI Agent x402。" />
  <meta property="og:image" content="og-cover.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    .hero { max-width: 1040px; margin: 0 auto; padding: 48px 20px 20px; }
    .hero h1 { font-size: 36px; margin-bottom: 10px; }
    .hero p { color: var(--text-muted); max-width: 720px; }
    .toolbar {
      max-width: 1040px; margin: 0 auto 16px; padding: 0 20px;
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between;
    }
    .search-input {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 10px 14px; border-radius: 8px; width: 340px; max-width: 100%; font-size: 14px;
    }
    .tracks-section { max-width: 1040px; margin: 0 auto 20px; padding: 0 20px; }
    .tracks-title { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .tracks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
    .track-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; cursor: pointer; transition: 0.15s; text-align: left; color: var(--text);
    }
    .track-card:hover { border-color: var(--accent); }
    .track-card.active { border-color: var(--accent); background: var(--accent-soft); }
    .track-card .t-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .track-card .t-desc { font-size: 12px; color: var(--text-muted); line-height: 1.45; }
    .track-card .t-prog { font-size: 11px; font-family: var(--mono); color: var(--accent); }
    .filter-row {
      max-width: 1040px; margin: 0 auto 24px; padding: 0 20px;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .filter-btn {
      padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); transition: 0.15s;
    }
    .filter-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .modules-wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 80px; display: grid; gap: 24px; }
    .module-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
    }
    .module-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 12px; flex-wrap: wrap; }
    .module-head h2 { font-size: 20px; }
    .module-meta-right { display: flex; align-items: center; gap: 10px; }
    .module-layer { font-size: 12px; color: var(--accent); }
    .mod-prog-badge { font-size: 11px; font-family: var(--mono); padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); }
    .mod-prog-badge.all-done { border-color: rgba(16, 185, 129, 0.55); color: #6ee7b7; background: rgba(16, 185, 129, 0.12); }
    .backup-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    .backup-modal.open { display: flex; }
    .backup-dialog { width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
    .lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 16px; }
    .lesson-card {
      display: flex; flex-direction: column; justify-content: space-between;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px; color: var(--text); transition: 0.15s;
    }
    .lesson-card:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-2px); }
    .lesson-card.done { border-color: var(--green); }
    .lesson-card h3 { font-size: 16px; margin-bottom: 6px; }
    .lesson-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
    .tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface); color: var(--text-muted); }
    .prereq-row {
      margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border);
      font-size: 11px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    .prereq-chip { padding: 1px 7px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }
    .prereq-chip.met { border-color: rgba(16, 185, 129, 0.5); color: #6ee7b7; }
    .prereq-chip.unmet { border-color: rgba(245, 158, 11, 0.45); color: #fcd34d; }
    .view-switch { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 4px; }
    .view-btn { border: none; background: transparent; color: var(--text-muted); font-size: 13px; padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: 0.15s; }
    .view-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .stage-progress-pills { max-width: 1040px; margin: 0 auto 18px; padding: 0 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .sp-pill { padding: 5px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
    .sp-pill.unlocked { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .growth-wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 80px; display: grid; gap: 22px; }
    .seed-card { background: linear-gradient(135deg, rgba(56,189,248,0.12), rgba(16,185,129,0.08)); border: 1.5px solid var(--accent); border-radius: var(--radius); padding: 24px; }
    .seed-tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
    .growth-stage { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .tension-box { background: rgba(245, 158, 11, 0.1); border-left: 3px solid var(--amber); border-radius: 8px; padding: 12px 15px; margin: 12px 0 18px; font-size: 14px; line-height: 1.65; }
    .tension-box strong { color: var(--amber); }
    .causal-node { border-top: 1px dashed var(--border); padding-top: 16px; margin-top: 16px; }
    .causal-node:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
    .causal-why { font-size: 13px; color: var(--card-text); margin-bottom: 12px; padding: 8px 12px; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--border); }
    .closure-box { margin-top: 18px; padding: 12px 15px; border-radius: 8px; font-size: 13px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.35); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  </style>
</head>
<body>
  <header class="atlas-topbar">
    <a class="brand" href="index.html">
      <img src="favicon.svg" alt="" width="22" height="22" />
      <span>Web3 Interactive Atlas</span>
    </a>
    <div class="nav-actions">
      <a class="btn" style="padding:5px 10px;font-size:13px;" href="tools.html">🧰 工具箱</a>
      <a class="btn" style="padding:5px 10px;font-size:13px;" href="glossary.html">📖 术语速查</a>
      <button id="btn-open-backup" class="btn" style="padding:5px 10px;font-size:13px;">进度备份/恢复</button>
      <button id="home-theme-btn" class="btn" style="padding:5px 10px;font-size:13px;"></button>
      <a class="btn" style="padding:5px 10px;font-size:13px;" href="https://github.com/liamamilin/web3-interactive-atlas" target="_blank" rel="noopener">GitHub ↗</a>
    </div>
  </header>
  <section class="hero">
    <h1>Web3 Interactive Atlas</h1>
    <p>不平铺概念清单：从 <strong>1 颗核心种子</strong>出发，看清每一次现实张力如何逼出整个 Web3（22 模块 · 44 个交互沙盒）。</p>
  </section>

  <div class="toolbar">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="view-switch" role="tablist">
        <button id="tab-growth" class="view-btn active" role="tab">🌱 种子演化视图</button>
        <button id="tab-catalog" class="view-btn" role="tab">📚 完整目录与路线</button>
      </div>
      <input id="search" class="search-input" type="search" placeholder="搜索主题、概念（如 Proxy、AMM、MEV、EIP-7702）..." />
    </div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <div id="progress-summary" style="font-size:14px;color:var(--text-muted);"></div>
      <a id="quiz-entry-btn" class="btn btn-primary" href="quiz.html">🧭 V1–V5 综合排雷测验</a>
    </div>
  </div>

  <div id="growth-mode">
    <div id="stage-pills" class="stage-progress-pills"></div>
    <main id="growth-wrap" class="growth-wrap"></main>
  </div>

  <div id="catalog-mode" style="display:none;">
    <section class="tracks-section">
      <div class="tracks-title">
        <span>🎯 推荐学习路线（点击路线按推荐顺序过滤课程，再次点击取消）</span>
        <span id="track-hint" style="color:var(--accent)"></span>
      </div>
      <div id="tracks-grid" class="tracks-grid"></div>
    </section>

    <div id="filter-row" class="filter-row">
      <button class="filter-btn active" data-layer="ALL">全部阶段 (V1–V5)</button>
      <button class="filter-btn" data-layer="V1">V1 · 链上生存与托管</button>
      <button class="filter-btn" data-layer="V2">V2 · DeFi 金融引擎</button>
      <button class="filter-btn" data-layer="V3">V3 · 底层基建与隐私</button>
      <button class="filter-btn" data-layer="V4">V4 · 经济模型与投研</button>
      <button class="filter-btn" data-layer="V5">V5 · 前沿叙事与体验</button>
    </div>

    <main id="modules" class="modules-wrap"></main>
  </div>

  <div id="backup-modal" class="backup-modal" role="dialog" aria-modal="true" aria-label="进度备份与恢复">
    <div class="backup-dialog">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="font-size:17px;">📦 跨设备学习进度备份 / 恢复</h3>
        <button id="btn-close-backup" class="btn" style="padding:4px 10px;">关闭</button>
      </div>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">全选复制下方 JSON 即可保存全部课程与排雷测验进度；换设备时粘贴后点击「导入恢复」。</p>
      <textarea id="backup-text" rows="5" placeholder="粘贴之前导出的 JSON 进度代码..."></textarea>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center;">
        <button id="btn-select-backup" class="btn btn-primary">全选进度代码</button>
        <button id="btn-import-backup" class="btn">导入并恢复</button>
        <span id="backup-msg" style="font-size:12px;color:var(--green);"></span>
      </div>
    </div>
  </div>

  <script src="shared/sandbox-ui.js"></script>
  <script src="catalog.js"></script>
  <script src="shared/growth-view.js"></script>
  <script>
    const catalog = window.WEB3_ATLAS_CATALOG || { modules: [] };
    const progress = window.AtlasUI.getProgress();
    const wrap = document.getElementById("modules");
    const searchEl = document.getElementById("search");
    const summaryEl = document.getElementById("progress-summary");
    const tracksGrid = document.getElementById("tracks-grid");
    const trackHint = document.getElementById("track-hint");

    const TRACKS = [
      {
        id: "survival",
        name: "🛡️ 新手防坑生存线",
        desc: "助记词、CEX 托管边界、Gas、防盗授权到第一笔 Swap",
        modules: ["01-wallet-keys", "20-custody-multisig", "02-tx-gas-multichain", "03-security-traps", "04-first-swap-amm"]
      },
      {
        id: "defi",
        name: "⚡ DeFi 交易与收益线",
        desc: "智能合约乐高、AMM/v3、稳定币、借贷、质押循环贷、Pendle 与 MEV",
        modules: ["22-smart-contracts-composability", "04-first-swap-amm", "19-clmm-yield-splitting", "05-stablecoins-peg", "06-lending-liquidation", "18-staking-restaking", "07-perps-leverage", "11-mev-dark-forest"]
      },
      {
        id: "research",
        name: "🔍 链上投研排雷线",
        desc: "联合曲线 PvP、解锁抛压、预言机、真实收益与链上指标体检",
        modules: ["08-bonding-curves", "12-tokenomics", "13-oracles-real-apps", "14-onchain-forensics"]
      },
      {
        id: "frontier",
        name: "🚀 底层原理与前沿线",
        desc: "账本共识、L2 跨链桥、ZK 隐私、账户抽象、RWA 与 AI Agent",
        modules: ["09-consensus-ledger", "10-scaling-bridges", "21-zk-privacy", "15-account-abstraction", "16-rwa-institutional", "17-ai-agent-crypto"]
      }
    ];

    // Build lesson lookup map for prerequisite titles
    const lessonByPath = {};
    const moduleById = {};
    catalog.modules.forEach((m) => {
      moduleById[m.id] = m;
      m.lessons.forEach((l) => { lessonByPath[l.path] = l; });
    });

    window.AtlasUI.bindThemeToggle(document.getElementById("home-theme-btn"));
    let activeLayer = "ALL";
    let activeTrack = window.AtlasUI.getActiveTrack();

    function renderTracks() {
      tracksGrid.innerHTML = TRACKS.map((t) => {
        let total = 0, done = 0;
        t.modules.forEach((mid) => {
          const m = moduleById[mid];
          if (!m) return;
          m.lessons.forEach((l) => { total++; if (progress[l.path]) done++; });
        });
        return `
          <button class="track-card ${activeTrack === t.id ? "active" : ""}" data-track="${t.id}">
            <div class="t-name">
              <span>${t.name}</span>
              <span class="t-prog">${done}/${total}</span>
            </div>
            <div class="t-desc">${t.desc}</div>
          </button>
        `;
      }).join("");

      tracksGrid.querySelectorAll(".track-card").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.track;
          activeTrack = activeTrack === id ? null : id;
          window.AtlasUI.setActiveTrack(activeTrack);
          if (activeTrack) {
            activeLayer = "ALL";
            document.querySelectorAll(".filter-btn").forEach((b) => b.classList.toggle("active", b.dataset.layer === "ALL"));
          }
          renderTracks();
          render();
        });
      });
    }

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      let totalAll = 0, doneAll = 0;
      catalog.modules.forEach((m) => m.lessons.forEach((l) => {
        totalAll++;
        if (progress[l.path]) doneAll++;
      }));
      summaryEl.textContent = `总学习进度：${doneAll} / ${totalAll} 已掌握`;
      try {
        const qSaved = JSON.parse(localStorage.getItem("web3_atlas_quiz_v1") || "{}");
        const cleared = ["V1", "V2", "V3", "V4", "V5"].filter((k) => qSaved[k]?.cleared).length;
        const qBtn = document.getElementById("quiz-entry-btn");
        if (qBtn) qBtn.textContent = cleared > 0 ? `🧭 排雷测验（已通关 ${cleared}/5）` : "🧭 V1–V5 综合排雷测验";
      } catch {}

      let displayModules = catalog.modules.slice();
      if (activeTrack) {
        const trackObj = TRACKS.find((t) => t.id === activeTrack);
        displayModules = (trackObj ? trackObj.modules : []).map((mid) => moduleById[mid]).filter(Boolean);
        trackHint.textContent = trackObj ? `当前路线：${trackObj.name}（按建议学习顺序排列）` : "";
      } else {
        trackHint.textContent = "";
      }

      wrap.innerHTML = "";
      displayModules.forEach((mod, idx) => {
        if (!activeTrack && activeLayer !== "ALL" && !(mod.layer || "").startsWith(activeLayer)) return;
        const lessons = mod.lessons.filter((l) => {
          if (!q) return true;
          const hay = [mod.title.zh, l.title.zh, l.subtitle.zh, ...(l.concepts || [])].join(" ").toLowerCase();
          return hay.includes(q);
        });
        if (!lessons.length) return;

        const modTotal = mod.lessons.length;
        const modDone = mod.lessons.filter((l) => !!progress[l.path]).length;
        const stepPrefix = activeTrack ? `Step ${idx + 1} · ` : "";
        const card = document.createElement("section");
        card.className = "module-card";
        card.innerHTML = `
          <div class="module-head">
            <h2>${stepPrefix}${mod.icon || "📦"} ${mod.title.zh}</h2>
            <div class="module-meta-right">
              <span class="module-layer">${mod.layer || ""}</span>
              <span class="mod-prog-badge ${modDone === modTotal ? "all-done" : ""}">${modDone === modTotal ? "✓ " : ""}${modDone}/${modTotal}</span>
            </div>
          </div>
          <p style="font-size:14px;color:var(--text-muted)">${mod.summary?.zh || ""}</p>
          <div class="lesson-grid">
            ${lessons.map((l) => {
              const isDone = !!progress[l.path];
              const prereqs = (l.prerequisites || []).filter((p) => lessonByPath[p]);
              const prereqHtml = prereqs.length ? `
                <div class="prereq-row">
                  <span>建议前置：</span>
                  ${prereqs.map((p) => {
                    const met = !!progress[p];
                    return `<span class="prereq-chip ${met ? "met" : "unmet"}">${met ? "✓ " : "○ "}${lessonByPath[p].title.zh}</span>`;
                  }).join("")}
                </div>
              ` : "";
              return `
                <a class="lesson-card ${isDone ? "done" : ""}" href="${l.path}">
                  <div>
                    <h3>${isDone ? "✓ " : ""}${l.title.zh}</h3>
                    <p>${l.subtitle.zh}</p>
                    <div class="tag-row">
                      ${(l.concepts || []).map((c) => `<span class="tag">${c}</span>`).join("")}
                    </div>
                  </div>
                  ${prereqHtml}
                </a>
              `;
            }).join("")}
          </div>
        `;
        wrap.appendChild(card);
      });

      if (!wrap.children.length) {
        wrap.innerHTML = `<p style="color:var(--text-muted)">暂无匹配课程。</p>`;
      }
    }

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeTrack = null;
        window.AtlasUI.setActiveTrack(null);
        renderTracks();
        document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeLayer = btn.dataset.layer;
        render();
      });
    });
    const growthCtrl = window.AtlasGrowth.mountGrowthView({ catalog, moduleById, lessonByPath });
    const growthModeEl = document.getElementById("growth-mode");
    const catalogModeEl = document.getElementById("catalog-mode");
    const tabGrowth = document.getElementById("tab-growth");
    const tabCatalog = document.getElementById("tab-catalog");
    let currentView = "growth";
    function switchView(v) {
      currentView = v;
      tabGrowth.classList.toggle("active", v === "growth");
      tabCatalog.classList.toggle("active", v === "catalog");
      growthModeEl.style.display = v === "growth" ? "block" : "none";
      catalogModeEl.style.display = v === "catalog" ? "block" : "none";
      if (v === "growth") growthCtrl.render();
      else { renderTracks(); render(); }
    }
    tabGrowth.addEventListener("click", () => { searchEl.value = ""; switchView("growth"); });
    tabCatalog.addEventListener("click", () => switchView("catalog"));
    searchEl.addEventListener("input", () => {
      if (searchEl.value.trim() && currentView !== "catalog") switchView("catalog");
      else if (currentView === "catalog") render();
    });

    const modal = document.getElementById("backup-modal");
    const backupText = document.getElementById("backup-text");
    const backupMsg = document.getElementById("backup-msg");
    const buildExportJson = () => JSON.stringify({
      lessons: window.AtlasUI.getProgress(),
      quiz: JSON.parse(localStorage.getItem("web3_atlas_quiz_v1") || "{}")
    }, null, 2);
    document.getElementById("btn-open-backup").addEventListener("click", () => {
      backupText.value = buildExportJson(); backupMsg.textContent = ""; modal.classList.add("open");
    });
    document.getElementById("btn-close-backup").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("open"); });
    document.getElementById("btn-select-backup").addEventListener("click", () => {
      backupText.value = buildExportJson();
      backupText.focus();
      backupText.select();
      backupMsg.style.color = "var(--green)"; backupMsg.textContent = "✓ 已全选，按 ⌘+C / Ctrl+C 复制即可";
    });
    document.getElementById("btn-import-backup").addEventListener("click", () => {
      try {
        const p = JSON.parse(backupText.value.trim());
        if (p.lessons && typeof p.lessons === "object") localStorage.setItem("web3_atlas_progress_v1", JSON.stringify(p.lessons));
        if (p.quiz && typeof p.quiz === "object") localStorage.setItem("web3_atlas_quiz_v1", JSON.stringify(p.quiz));
        Object.keys(progress).forEach((k) => delete progress[k]);
        Object.assign(progress, window.AtlasUI.getProgress());
        renderTracks(); render();
        backupMsg.style.color = "var(--green)"; backupMsg.textContent = "✓ 进度已成功恢复！";
      } catch {
        backupMsg.style.color = "var(--red)"; backupMsg.textContent = "✕ JSON 格式无效，请检查粘贴内容";
      }
    });

    renderTracks();
    render();
    switchView("growth");
  </script>
</body>
</html>
